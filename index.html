<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 MOBILE MOD MENU v5.0 📱</title>
    <style>
        :root {
            --primary: #00ff66;
            --accent-yellow: #ffcc00;
            --bg-dark: #000000;
            --panel-bg: #141519;
            --card-bg: #1c1e24;
            --text: #ffffff;
            --text-dim: #a0a5b5;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: white;
            margin-top: 10px;
            margin-bottom: 2px;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .subtitle {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Buscador */
        .search-container {
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
        }

        .search-bar {
            width: 100%;
            padding: 14px 20px;
            background: var(--panel-bg);
            border: 1px solid #2d3139;
            border-radius: 25px;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Cuadrícula de Juegos */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 450px;
            padding-bottom: 30px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 1px solid #252830;
        }

        .game-thumbnail {
            height: 130px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 10px;
            position: relative;
        }
